
<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>猫の健康管理アプリ</title>
  </head>
  <body>
    <div id="app">
      <header class="header">
        <h1>猫の健康管理アプリ</h1>
        <p>大切な家族の健康を記録しましょう。</p>
      </header>

      <main>
        <!-- ログイン・ユーザー登録エリア -->
        <section id="auth-section">

          <!-- ログインフォーム -->
          <div id="login-area">
            <h2>ログイン</h2>

            <form id="login-form">
              <div class="form-group">
                <label for="login-email">メールアドレス</label>
                <input
                  type="email"
                  id="login-email"
                  name="email"
                  required
                />
              </div>

              <div class="form-group">
                <label for="login-password">パスワード</label>
                <input
                  type="password"
                  id="login-password"
                  name="password"
                  required
                />
              </div>

              <button type="submit">ログイン</button>
            </form>

            <button type="button" id="show-signup">
              新規ユーザー登録はこちら
            </button>
          </div>

          <!-- ユーザー登録フォーム -->
          <div id="signup-area" hidden>
            <h2>新規ユーザー登録</h2>

            <form id="signup-form">
              <div class="form-group">
                <label for="signup-email">メールアドレス</label>
                <input
                  type="email"
                  id="signup-email"
                  name="email"
                  required
                />
              </div>

              <div class="form-group">
                <label for="signup-password">パスワード</label>
                <input
                  type="password"
                  id="signup-password"
                  name="password"
                  minlength="8"
                  required
                />
              </div>

              <button type="submit">登録する</button>
            </form>

            <button type="button" id="show-login">
              ログイン画面に戻る
            </button>
          </div>

          <p id="auth-message" role="status"></p>
        </section>

        <!-- ログイン後に表示するエリア -->
        <section id="app-section" hidden>

          <div class="user-info">
            <p id="user-email"></p>
            <button type="button" id="logout-button">
              ログアウト
            </button>
          </div>

          <section class="cat-register">
            <h2>猫を登録する</h2>

            <form id="cat-form">
              <div class="form-group">
                <label for="cat-photo">顔写真</label>
                <input
                  type="file"
                  id="cat-photo"
                  name="photo"
                  accept="image/jpeg,image/png,image/webp"
                />

                <div id="photo-preview-area" hidden>
                  <img
                    id="photo-preview"
                    alt="猫の顔写真プレビュー"
                    width="150"
                  />
                </div>
              </div>

              <div class="form-group">
                <label for="cat-name">名前</label>
                <input
                  type="text"
                  id="cat-name"
                  name="name"
                  placeholder="例：ルナ"
                  required
                />
              </div>

              <div class="form-group">
                <label for="cat-birthday">生年月日</label>
                <input
                  type="date"
                  id="cat-birthday"
                  name="birthday"
                  required
                />
              </div>

              <div class="form-group">
                <label for="cat-gender">性別</label>
                <select id="cat-gender" name="gender" required>
                  <option value="">選択してください</option>
                  <option value="オス">オス</option>
                  <option value="メス">メス</option>
                </select>
              </div>

              <button type="submit">猫を登録する</button>
            </form>
          </section>

          <section class="cat-list">
            <h2>登録済みの猫</h2>
            <p id="cat-message" role="status"></p>
            <div id="cat-list"></div>
          </section>

        </section>
      </main>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
